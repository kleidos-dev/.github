#
# SonarQube Cloud project configuration for kleidos-dev/.github. The CI
# workflow (ci.yml, its SonarCloud job, the kit's reusable-sonarcloud.yml)
# runs the scan with a secretless OIDC token; this file holds every other
# setting a properties file can carry, so the project can be rebuilt from
# the repository alone.
# Only what a file cannot hold is set in the SonarQube Cloud web UI: the
# new code period (30 days), the organization's default quality gate
# ("Kleidos (agentic AI level)") and its default quality profiles, which the
# project follows, and Automatic Analysis, which is off (docs/sonarcloud.md).
# Scanner reference:
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

# --- Project identification ---
# One SonarQube Cloud organization per GitHub owner, its key the owner's login;
# each project's key is <organization>_<repository>, the form the import flow
# generates and every jmrplens project already uses (jmrplens_phonometry, ...).
sonar.organization=kleidos-dev
sonar.projectKey=kleidos-dev_.github
sonar.projectName=.github
sonar.projectDescription=Organization profile and community files for Kleidos

# --- Links shown on the project page ---
# Issues are turned off in this repository; questions and requests go to the
# organization's Discussions (SUPPORT.md), so that is the tracker link.
sonar.links.homepage=https://kleidos.dev
sonar.links.scm=https://github.com/kleidos-dev/.github
sonar.links.ci=https://github.com/kleidos-dev/.github/actions
sonar.links.issue=https://github.com/orgs/kleidos-dev/discussions

# --- Layout ---
# The only code is the media metadata tools and their tests. The profile, the
# community files, the forms and the banners are text and artwork, not code,
# so they are outside the source roots. The commit-message gate under
# .github/commit-check/ is a synced copy of kleidos-dev/agents, analyzed (and
# fixed) there; no source root here contains it, so it needs no exclusion.
sonar.sources=scripts
sonar.tests=tests
# Only the test modules are test code; tests/fixtures/ holds text fixtures.
sonar.test.inclusions=tests/**/test_*.py
sonar.sourceEncoding=UTF-8

# --- Scanner ---
# The layout above is explicit, so the scanner must not guess its own
# (the import set this to true in the UI; reset there and pinned here).
sonar.scanner.autoconfig.enabled=false

# --- Language ---
# The newest Python version SonarQube Cloud lists as supported; the CI runs
# the version in .python-version, so raise this when the docs list it.
sonar.python.version=3.14

# --- Coverage ---
# The Cobertura report the CI job writes with relative paths (coverage.py's
# relative_files = True in .coveragerc, required on GitHub Actions) and hands
# to the SonarCloud job as the "coverage" artifact.
sonar.python.coverage.reportPaths=coverage.xml

# No sonar.issue.ignore.*, no coverage.exclusions and no cpd.exclusions to move
# a number: an issue is fixed with a real change or left open, and coverage is
# raised with tests (the Kleidos rule since 2026-07-12).
