version = 1
SPDX-PackageName = ".github"
SPDX-PackageDownloadLocation = "https://github.com/kleidos-dev/.github"

# The organization's profile, its community defaults and their pages:
# GPL-3.0-or-later, the license of Kleidos.
[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 José M. Requena Plens"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The profile banners are this project's artwork. They contain glyph
# outlines of Mona Sans, Mona Sans Mono and Inter (SIL Open Font License
# 1.1; outlines inside artwork are not Font Software) and the Kleidos
# board drawings, which are the author's own work (MIT in
# kleidos-dev/boards); the banners credit both in their metadata.
[[annotations]]
path = ["profile/assets/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 José M. Requena Plens"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The banners' records quote the banners' credits, which name the font
# authors; those names are credits, not holders of the manifest.
[[annotations]]
path = ["profile/assets/assets.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 José M. Requena Plens"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Adapted from the Contributor Covenant, version 2.1.
[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "The Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Tooling: the commit-message gate copied from kleidos-dev/agents (MIT
# there), the media metadata module and checker shared with the other
# kleidos-dev repositories, their tests, the CI configuration, and the
# configuration of the review bots (CodeRabbit, Greptile), SonarCloud,
# coverage.py and markdownlint. The JSON files and .python-version cannot
# hold a comment, so this row is their only license statement.
[[annotations]]
path = [
  ".github/commit-check/**",
  ".github/workflows/**",
  ".github/dependabot.yml",
  ".pre-commit-config.yaml",
  ".coderabbit.yaml",
  ".greptile/**",
  ".coveragerc",
  ".markdownlint.json",
  ".python-version",
  "requirements.txt",
  "sonar-project.properties",
  "scripts/**",
  "tests/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 José M. Requena Plens"
SPDX-License-Identifier = "MIT"
