#
# What every workflow of this repository, and each model a repository copies,
# does, word for word but its comments, with the reason of each job and each
# step (why). They run in every repository at the branch v3, so
# test_workflow_contract.py compares them with this file: a step, a condition, a permission or a line of a
# script changes here too, on purpose, with its reason.
check.yml:
  name: Quality kit, check
  'on':
    workflow_call:
      inputs:
        python:
          description: What pip installs before the tests and mypy (its arguments; empty for nothing)
          type: string
          default: ''
        install:
          description: A command instead of python, for what pip's arguments cannot say
          type: string
          default: ''
        tests:
          description: The test command, which writes the coverage report (empty for no tests job)
          type: string
          default: ''
        coverage-report:
          description: The coverage report the tests write (empty for none)
          type: string
          default: coverage.xml
        coverage-artifact:
          description: The artifact the report is uploaded as, for sonar.yml
          type: string
          default: coverage
        timeout-minutes:
          description: The bound of the tests job
          type: number
          default: 15
        types:
          description: Run mypy (false only where the tree holds no Python)
          type: boolean
          default: true
        types-install:
          description: What mypy needs installed, where it differs from the tests (a command)
          type: string
          default: ''
        python-version-file:
          description: The file that names the Python of the tests and mypy
          type: string
          default: .python-version
        node-directory:
          description: The folder of package.json, for ESLint and tsc (empty for no TypeScript job)
          type: string
          default: ''
        node-projects:
          description: Space-separated tsconfig files tsc checks, relative to node-directory
          type: string
          default: tsconfig.json
        node-version:
          description: The Node.js to run with
          type: string
          default: lts/*
  permissions: {}
  jobs:
    tests:
      name: 🧪 Tests
      if: inputs.tests != ''
      uses: ./.github/workflows/reusable-python-tests.yml
      with:
        install: ${{ inputs.install || (inputs.python && format('python -I -m pip install {0}', inputs.python)) || '' }}
        run: ${{ inputs.tests }}
        python-version-file: ${{ inputs.python-version-file }}
        coverage-report: ${{ inputs.coverage-report }}
        coverage-artifact: ${{ inputs.coverage-artifact }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
      permissions:
        contents: read
      why: no tests job without a test command; reads the code and nothing else
    types:
      name: 🔎 Types
      if: inputs.types
      uses: ./.github/workflows/reusable-mypy.yml
      with:
        install: ${{ inputs.types-install || inputs.install || (inputs.python && format('python -I -m pip install {0}', inputs.python)) || '' }}
        python-version-file: ${{ inputs.python-version-file }}
      permissions:
        contents: read
      why: on unless the tree holds no Python, which the checker judges
    typescript:
      name: 🔎 TypeScript
      if: inputs.node-directory != ''
      uses: ./.github/workflows/reusable-eslint.yml
      with:
        working-directory: ${{ inputs.node-directory }}
        projects: ${{ inputs.node-projects }}
        node-version: ${{ inputs.node-version }}
      permissions:
        contents: read
      why: where the tree holds TypeScript, which the checker judges
    osv:
      name: 🛡️ Dependencies
      uses: ./.github/workflows/reusable-osv.yml
      permissions:
        contents: read
      why: always, so the weekly run sees new advisories
ci.yml:
  name: CI
  'on':
    pull_request:
      branches:
      - main
    push:
      branches:
      - main
    schedule:
    - cron: 0 5 * * 1
    workflow_dispatch: null
  permissions:
    contents: read
  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
  jobs:
    quick:
      name: ⚡ Quick
      uses: ./.github/workflows/quick.yml
      with:
        skip: kleidos-quality-kit-tests
        deny-hooks: kleidos-media-stamp,kleidos-media-metadata
      secrets:
        deny: ${{ secrets.KLEIDOS_DENY_EXTRA }}
      permissions:
        contents: read
      why: the kit's own first caller, by ./ path, with the deny-list for the media hooks
    check:
      name: 🧪 Check
      needs: quick
      uses: ./.github/workflows/check.yml
      with:
        install: python -I -m pip install -r requirements.txt && python -I -m pip install --require-hashes -r quality/requirements-tools.txt
        tests: python -m coverage run -m unittest discover -s tests -v && python -m coverage run --append -m unittest discover -s quality/tests -v && python -m coverage xml -o coverage.xml && python -m coverage report && python quality/coverage_floor.py
      permissions:
        contents: read
      why: every test of this repository, its coverage measured and held to its floors
    release:
      name: 🏷️ Kit release and its tag
      needs: quick
      runs-on: ubuntu-latest
      timeout-minutes: 5
      why: no token beyond the workflow's read
      steps:
      - why: the code under check; no credential is left for the steps after it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - why: one Python everywhere, not the runner's
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - why: every package is checked against its SHA-256
        name: Install the kit's tools (hashed)
        run: python -I -m pip install --require-hashes -r quality/requirements-tools.txt
      - why: on main the version must be tagged and the branch moved, a pull request must carry a new version, and every release tag is signed, as GitHub verifies with the read token
        name: The kit at this commit is a release, or a new version
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          on_main=()
          if [ "${EVENT}" != pull_request ]; then
            on_main=(--on-main)
          fi
          python quality/sync.py --release-check --online "${on_main[@]}"
    preview:
      name: 🔭 Impact on the public consumers
      needs: check
      if: github.event_name != 'schedule'
      runs-on: ubuntu-latest
      timeout-minutes: 15
      why: 'not weekly: it clones the public repositories'
      steps:
      - why: the code under check; no credential is left for the steps after it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - why: one Python everywhere, not the runner's
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - why: every package is checked against its SHA-256
        name: Install the kit's tools (hashed)
        run: python -I -m pip install --require-hashes -r quality/requirements-tools.txt
      - why: 'informs, with the public repositories only: no --all'
        name: Apply the kit to throwaway clones and count what it finds
        run: python tools/ecosystem.py preview --summary "${GITHUB_STEP_SUMMARY}"
    sonar:
      name: 📊 Sonar
      needs: check
      if: github.event_name != 'schedule'
      uses: ./.github/workflows/sonar.yml
      permissions:
        contents: read
        id-token: write
      why: 'not weekly: a schedule is no analysis'
    done:
      name: ✅ Check
      needs:
      - quick
      - check
      - release
      - preview
      - sonar
      if: always()
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions: {}
      why: 'the required check: always runs, needs every other job, has no token'
      steps:
      - why: 'the gate: reads every job''s result whatever happened, steered by nothing outside the step'
        name: Every job of this file succeeded
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: preview sonar
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin HOME=/nonexistent
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${NEEDS}" | jq -e --arg may " ${MAY_SKIP} " '
            length > 0 and all(to_entries[];
              .value.result == "success"
              or (.value.result == "skipped" and (.key as $job | $may | contains(" \($job) "))))' > /dev/null || {
            echo "::error title=Not every job succeeded::a job that failed, was cancelled or was skipped without leave is listed above"
            exit 1
          }
commit-check-comment.yml:
  name: Commit check comment
  'on':
    workflow_run:
      workflows:
      - CI
      types:
      - completed
  permissions: {}
  concurrency:
    group: commit-check-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: false
  jobs:
    comment:
      name: 🙋 Commit-check comment
      uses: ./.github/workflows/reusable-commit-check-comment.yml
      permissions:
        actions: read
        pull-requests: write
      why: follows the gate's workflow, grants what the comment needs
ecosystem.yml:
  name: Ecosystem report
  'on':
    schedule:
    - cron: 0 6 * * 1
    workflow_dispatch: null
    pull_request:
      branches:
      - main
      paths:
      - .github/workflows/ecosystem.yml
      - tools/ecosystem.py
      - tools/ecosystem.toml
  permissions:
    contents: read
  concurrency:
    group: ecosystem-${{ github.ref }}
    cancel-in-progress: true
  jobs:
    report:
      name: 🌍 Public repositories
      runs-on: ubuntu-latest
      timeout-minutes: 15
      why: the workflow's read token and no secret
      steps:
      - why: the code under check; no credential is left for the steps after it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - why: one Python everywhere, not the runner's
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - why: every package is checked against its SHA-256
        name: Install the kit's tools (hashed)
        run: python -I -m pip install --require-hashes -r quality/requirements-tools.txt
      - why: 'the public half only: no --all, the job''s own read token; red fails it, but on a pull request'
        name: Read the public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          status=0
          python tools/ecosystem.py report --summary "${GITHUB_STEP_SUMMARY}" || status=$?
          if [ "${status}" = 1 ] && [ "${EVENT}" = pull_request ]; then
            echo "::notice title=Ecosystem report::something is red today; this trial run does not fail for it"
            status=0
          fi
          exit "${status}"
quick.yml:
  name: Quality kit, quick
  'on':
    workflow_call:
      inputs:
        skip:
          description: Comma-separated ids of the repository's own hooks that cannot run in CI
          type: string
          default: ''
        deny-hooks:
          description: Comma-separated ids of its own local hooks that read the deny-list
          type: string
          default: ''
      secrets:
        deny:
          description: The deny-list of private values (KLEIDOS_DENY_EXTRA), one pattern per line
          required: false
  permissions: {}
  jobs:
    lint:
      name: 🧹 Lint
      uses: ./.github/workflows/reusable-lint.yml
      with:
        skip: ${{ inputs.skip }}
        deny-hooks: ${{ inputs.deny-hooks }}
      permissions:
        contents: read
      why: always; the hooks the caller skips are judged inside
    deny:
      name: 🕵️ Deny-list
      if: inputs.deny-hooks != ''
      uses: ./.github/workflows/reusable-deny.yml
      with:
        hooks: ${{ inputs.deny-hooks }}
      secrets:
        deny: ${{ secrets.deny }}
      permissions:
        contents: read
      why: where the caller has hooks that read the deny-list; the one job with the secret
    reuse:
      name: ⚖️ Licensing
      uses: ./.github/workflows/reusable-reuse.yml
      permissions:
        contents: read
      why: 'always: every file has a license'
    secrets:
      name: 🔐 Secrets
      uses: ./.github/workflows/reusable-secrets.yml
      permissions:
        contents: read
      why: 'always: the whole history, every run'
    commits:
      name: ✍️ Commits
      if: github.event_name == 'pull_request' || github.event_name == 'push'
      uses: ./.github/workflows/reusable-commit-check.yml
      permissions:
        contents: read
      why: what adds commits, a pull request and a push; a schedule and a run by hand add none
reusable-commit-check-comment.yml:
  name: Commit check comment
  'on':
    workflow_call: null
  permissions: {}
  jobs:
    comment:
      name: 🙋 Post the commit-check comment
      if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
        actions: read
        pull-requests: write
      why: only for a pull request's run that ended, with a token that may write one comment and cannot read the code
      steps:
      - why: the checks are the kit's at the commit of this very workflow; a copy of the workflow in another repository stops here
        name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          kit="${RUNNER_TEMP}/kit"
          git init -q "${kit}"
          git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
          git -C "${kit}" checkout -q FETCH_HEAD
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - why: a run that left no result has nothing to post, which is no failure
        name: Fetch the check's result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: commit-check
          path: ${{ runner.temp }}/commit-check
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - why: the kit's checker reads the artifact as data, for the head the check ran on
        name: Post, update or remove the comment
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          KIT: ${{ steps.kit.outputs.dir }}
        run: |
          python3 "$KIT/hooks/check_commit_msg.py" \
            --comment "$RUNNER_TEMP/commit-check/result.json" \
            --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
reusable-commit-check.yml:
  name: Commit check
  'on':
    workflow_call: null
  permissions: {}
  jobs:
    commit-messages:
      name: ✍️ Check the commits
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
        contents: read
      why: 'a read token: it runs the pull request''s history, not its code'
      steps:
      - why: the code under check; no credential is left for the steps after it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - why: the checks are the kit's at the commit of this very workflow; a copy of the workflow in another repository stops here
        name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - why: every commit of the pull request, with the kit's checker, in the kit's home with the base branch's; only the two bots are excused
        name: Check the pull request's commits
        id: check
        if: github.event_name == 'pull_request'
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            'dependabot[bot]' | 'renovate[bot]')
              echo "Opened by $PR_AUTHOR, which authors its own commit messages: not checked." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "status=0" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          out="$RUNNER_TEMP/commit-check"
          mkdir -p "$out"
          if [ "$GITHUB_REPOSITORY" = kleidos-dev/.github ]; then
            # The base branch's checker, where kit 2.x kept it or where it is now.
            git show "$BASE_SHA:hooks/check_commit_msg.py" > "$out/check_commit_msg.py" 2>/dev/null \
              || git show "$BASE_SHA:.github/commit-check/check_commit_msg.py" > "$out/check_commit_msg.py"
          else
            cp "$KIT/hooks/check_commit_msg.py" "$out/check_commit_msg.py"
          fi
          status=0
          python3 "$out/check_commit_msg.py" --range "$BASE_SHA..$HEAD_SHA" \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --json "$out/result.json" || status=$?
          if [ -f "$out/result.json" ]; then
            python3 "$out/check_commit_msg.py" --render "$out/result.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - why: data for the comment, kept a week; none when nothing was checked
        name: Keep the result for the comment workflow
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: commit-check
          path: ${{ runner.temp }}/commit-check/result.json
          if-no-files-found: ignore
          retention-days: 7
      - why: whether what says it is the owner's is, as GitHub reports it, with the kit's checker, in the kit's home with the base branch's; a read token, and nothing of a fork's runs with it
        name: Check whose commits they are
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          JUDGE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_REPO: ${{ github.event_name == 'push' && github.repository || github.event.pull_request.head.repo.full_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          judge="$KIT"
          if [ "$GITHUB_REPOSITORY" = kleidos-dev/.github ]; then
            # The base branch's checker. A base from before 3.4.0 has none: a
            # branch of this repository is then judged by its own, and a
            # fork's by nothing, since its code would have the token.
            judge="$RUNNER_TEMP/judge"
            mkdir -p "$judge"
            git archive "$JUDGE_SHA" hooks | tar -x -C "$judge"
            if [ ! -f "$judge/hooks/commit_identity.py" ]; then
              if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
                echo "::notice title=Identity of the commits::not judged: the base branch has no checker"
                exit 0
              fi
              judge="$KIT"
            fi
          fi
          python3 "$judge/hooks/commit_identity.py"
      - why: the message check's own status fails the job, after the result was kept; a push has no message to check
        name: Fail on a rule the commits break
        if: github.event_name == 'pull_request' && steps.check.outputs.status != '0'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "The commit messages break the rules listed above (exit $STATUS)."
          exit 1
reusable-deny.yml:
  name: Quality kit deny-list
  'on':
    workflow_call:
      inputs:
        hooks:
          description: Comma-separated ids of the repository's own local hooks that read the deny-list
          type: string
          required: true
      secrets:
        deny:
          description: The deny-list of private values, one pattern per line
          required: false
  permissions: {}
  jobs:
    deny:
      name: 🕵️ Private values
      runs-on: ubuntu-latest
      timeout-minutes: 10
      permissions:
        contents: read
      why: 'a read token, and no condition: the caller decides whether there is something to run'
      steps:
      - why: the code under check; no credential is left for the steps after it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - why: the checks are the kit's at the commit of this very workflow; a copy of the workflow in another repository stops here
        name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - why: one Python everywhere, not the runner's
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - why: every package is checked against its SHA-256
        name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -I -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      - why: the one step with the secret, the last of a job where no third party's code ran; without it the checks say so
        name: The hooks that read the deny-list
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          HOOKS: ${{ inputs.hooks }}
          KLEIDOS_DENY_EXTRA: ${{ secrets.deny }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.deny == '' && '1' || '0' }}
        run: python "${KIT}/quality/deny_hooks.py" "${HOOKS}"
reusable-eslint.yml:
  name: Quality kit TypeScript
  'on':
    workflow_call:
      inputs:
        working-directory:
          description: The folder that holds package.json, package-lock.json and the ESLint config
          type: string
          default: .
        projects:
          description: Space-separated tsconfig files tsc checks, relative to working-directory
          type: string
          default: tsconfig.json
        node-version:
          description: The Node.js to run with
          type: string
          default: lts/*
  permissions: {}
  jobs:
    eslint:
      name: 🔎 ESLint and tsc
      runs-on: ubuntu-latest
      timeout-minutes: 15
      permissions:
        contents: read
      defaults:
        run:
          working-directory: ${{ inputs.working-directory }}
      why: a read token; every step runs in the package's folder
