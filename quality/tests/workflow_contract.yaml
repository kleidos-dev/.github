      - why: the whole history, every default rule, inline allow comments ignored, a finding fails the job
        name: History, default rules
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - why: the whole history again, with the MAC rules that extend nothing
        name: History, MAC rules
        run: gitleaks git . --config .gitleaks-mac.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - why: 'the tree too: what a history scan''s path rules may skip'
        name: Tree, default rules
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - why: the tree with the MAC rules
        name: Tree, MAC rules
        run: gitleaks dir . --config .gitleaks-mac.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - why: proves the rules still find what they are for; its failure fails the job
        name: The MAC rules fire on planted real shapes and spare the fakes
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python "${KIT}/quality/check_quality.py" --plant-mac
reusable-sonarcloud.yml:
  name: SonarCloud
  'on':
    workflow_call:
      inputs:
        coverage-artifact:
          description: The artifact holding the coverage report sonar-project.properties names (empty for none)
          type: string
          default: coverage
  permissions: {}
  jobs:
    sonarcloud:
      name: 📊 Analysis
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
      runs-on: ubuntu-latest
      timeout-minutes: 15
      permissions:
        contents: read
        id-token: write
      why: main and pull requests against it, and nothing else; the OIDC token is the job's purpose
      steps:
      - why: a pull request GitHub gives no token ends green with a notice; anything else must be analyzed
        name: OIDC token available
        id: oidc
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${EVENT}" = pull_request ] && { [ "${HEAD_REPO}" != "${REPO}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; }; then
            echo "::notice title=SonarCloud skipped::GitHub gives this pull request (from ${HEAD_REPO}) no OIDC token, so the secretless analysis cannot run; it runs once the change is on main."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi
      - why: the code under check; no credential is left for the steps after it
        if: steps.oidc.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - why: the report of the tests job of this run
        name: Fetch the coverage report
        if: steps.oidc.outputs.run == 'true' && inputs.coverage-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.coverage-artifact }}
      - why: a project's token for 30 minutes, and no stored secret
        name: SonarCloud token from the OIDC token
        if: steps.oidc.outputs.run == 'true'
        id: auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad
      - why: the scan's failure fails the job
        name: SonarCloud Scan
        if: steps.oidc.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        env:
          SONAR_HOST_URL: https://sonarcloud.io
      - why: an analysis the server refuses fails the job, and so does no answer
        name: SonarCloud accepted the analysis
        if: steps.oidc.outputs.run == 'true'
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          set -euo pipefail
          task="$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)"
          if [ -z "${task}" ]; then
            echo "::error::The scanner wrote no ceTaskId to .scannerwork/report-task.txt"
            exit 1
          fi
          while :; do
            body="$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/ce/task?id=${task}")"
            status="$(jq -r '.task.status' <<<"${body}")"
            case "${status}" in
              SUCCESS)
                echo "SonarCloud accepted analysis $(jq -r '.task.analysisId' <<<"${body}")"
                break
                ;;
              PENDING|IN_PROGRESS)
                sleep 5
                ;;
              *)
                reason="$(jq -r '.task.errorMessage // "no reason given"' <<<"${body}")"
                echo "::error::SonarCloud did not accept the analysis (${status}): ${reason}"
                exit 1
                ;;
            esac
          done
sonar.yml:
  name: Quality kit, sonar
  'on':
    workflow_call:
      inputs:
        coverage-artifact:
          description: The artifact check.yml uploaded the coverage report as (empty for none)
          type: string
          default: coverage
  permissions: {}
  jobs:
    sonarcloud:
      name: 📊 SonarCloud
      uses: ./.github/workflows/reusable-sonarcloud.yml
      with:
        coverage-artifact: ${{ inputs.coverage-artifact }}
      permissions:
        contents: read
        id-token: write
      why: the one call that may buy a token
quality/templates/run/ci.yml:
  name: CI
  'on':
    pull_request:
      branches:
      - main
    push:
      branches:
      - main
    schedule:
    - cron: 0 5 * * 1
    workflow_dispatch: null
  permissions:
    contents: read
  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
  jobs:
    quick:
      name: ⚡ Quick
      uses: kleidos-dev/.github/.github/workflows/quick.yml@v3
      secrets:
        deny: ${{ secrets.KLEIDOS_DENY_EXTRA }}
      permissions:
        contents: read
      why: the first caller, with the deny-list and the read grant
    check:
      name: 🧪 Check
      needs: quick
      uses: kleidos-dev/.github/.github/workflows/check.yml@v3
      with:
        python: -r requirements.txt
        tests: python -m pytest -rs --cov --cov-report=xml:coverage.xml tests
      permissions:
        contents: read
      why: the tests and the types, with the read grant and no secret
    sonar:
      name: 📊 Sonar
      needs: check
      if: github.event_name != 'schedule'
      uses: kleidos-dev/.github/.github/workflows/sonar.yml@v3
      permissions:
        contents: read
        id-token: write
      why: not weekly; the one caller that may be given an OIDC token
    done:
      name: ✅ Check
      needs:
      - quick
      - check
      - sonar
      if: always()
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions: {}
      why: 'the gate every repository''s is compared with: always runs, has no token'
      steps:
      - why: reads every job's result, steered by nothing outside the step
        name: Every job of this file succeeded
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: sonar
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin HOME=/nonexistent
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${NEEDS}" | jq -e --arg may " ${MAY_SKIP} " '
            length > 0 and all(to_entries[];
              .value.result == "success"
              or (.value.result == "skipped" and (.key as $job | $may | contains(" \($job) "))))' > /dev/null || {
            echo "::error title=Not every job succeeded::a job that failed, was cancelled or was skipped without leave is listed above"
            exit 1
          }
quality/templates/run/commit-check-comment.yml:
  name: Commit check comment
  'on':
    workflow_run:
      workflows:
      - CI
      types:
      - completed
  permissions: {}
  concurrency:
    group: commit-check-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: false
  jobs:
    comment:
      name: 🙋 Commit-check comment
      uses: kleidos-dev/.github/.github/workflows/reusable-commit-check-comment.yml@v3
      permissions:
        actions: read
        pull-requests: write
      why: grants what the comment needs and never the code
