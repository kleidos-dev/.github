reusable-lint.yml:
  name: Quality kit lint
  'on':
    workflow_call:
      inputs:
        python-version:
          description: The Python that runs the tools
          type: string
          default: '3.15'
        skip:
          description: Comma-separated ids of the repository's own hooks that cannot run here; a kit hook named here fails the kit check
          type: string
          default: ''
        deny-hooks:
          description: Comma-separated ids of the repository's own local hooks that read the deny-list, skipped here
          type: string
          default: ''
  permissions: {}
  jobs:
    lint:
      name: 🧹 Kit check, hooks and zizmor
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
        contents: read
      why: 'a read token, no secret: third parties'' hooks run here'
      steps:
      - why: the code under check with its whole history, which says what the thresholds were; no credential is left for the steps after it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - why: the checks are the kit's at the commit of this very workflow; a copy of the workflow in another repository stops here
        name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - why: one Python everywhere, not the runner's
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs.python-version }}
      - why: every package is checked against its SHA-256
        name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -I -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      - why: every policy check but the header lines, which have their own job; a hook the caller skips is judged; the base the change is compared with is the event's own, never the tree's; its failure fails the job
        name: The kit's policy checks
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          KIT_SHA: ${{ steps.kit.outputs.sha }}
          OWN_HOOKS: ${{ inputs.skip }},${{ inputs.deny-hooks }}
          BASE: ${{ github.event.pull_request.base.sha || (!github.event.forced && github.event.before) || '' }}
        run: python "${KIT}/quality/policy.py" --without spdx-headers --lint-skip "${OWN_HOOKS}" --github --summary "${GITHUB_STEP_SUMMARY}" --kit-sha "${KIT_SHA}" --base "${BASE}"
      - why: speed only; the key is the hook list, and no other job restores it
        name: Cache the hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - why: all files, not the changed ones; only the hooks that other jobs run, and the caller's own, are skipped
        name: Every pre-commit hook on every file
        env:
          OWN_HOOKS: ${{ inputs.skip }},${{ inputs.deny-hooks }}
        run: |
          # The policy checks ran above from the kit itself; mypy, reuse lint
          # and the header lines have workflows of their own. The first five
          # ids are the hooks of a repository that still holds kit 2.x copies.
          export SKIP="kleidos-quality,kleidos-md-nowrap,kleidos-agent-docs,kleidos-spdx-headers,mypy,kleidos-kit,kleidos-mypy,reuse,${OWN_HOOKS}"
          pre-commit run --all-files --show-diff-on-failure --color always
      - why: the audits the offline hook cannot make; a finding fails the job
        name: zizmor, online audits included
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .
