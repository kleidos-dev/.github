#
# Release binaries the kit's workflows run that neither PyPI nor a pre-commit
# hook repository provides, each pinned by version and SHA-256 (from the
# release's own checksum file). fetch_tool.py downloads one, checks the digest
# and installs it; fetch_tool.py --outdated compares each with the upstream
# release, and the CI's weekly "📦 Pinned versions current" job turns red when
# one is newer. The org's Actions policy allows no third-party action, so
# these replace the vendors' actions.

[osv-scanner]
version = "2.7.1"
repo = "google/osv-scanner"
url = "https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64"
sha256 = "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"

[gitleaks]
version = "8.30.1"
repo = "gitleaks/gitleaks"
url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
member = "gitleaks"
