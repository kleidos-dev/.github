#
# Keeps the GitHub Actions this repository pins by commit, the CI's Python
# tools pinned in requirements.txt, and the quality kit's tool versions
# current: at most one grouped pull request a week for each. Dependabot
# authors its own commit messages, so the commit-message gate skips its pull
# requests.
#
# The quality kit's versions are bumped here only (docs/quality.md,
# "Versions"): quality/requirements-tools.txt (pip, hashed), the hook revs
# of the kit's blocks in .pre-commit-config.yaml (pre-commit), and the
# actions its workflows pin (github-actions). A bump of what the CI runs
# reaches the other repositories with the release; their hook revisions are
# their own Dependabot's.
# Each such pull request is a kit release: before it merges, a signed
# commit on its branch bumps quality/VERSION and adds the CHANGELOG entry
# (the CI's release check fails until then), and the merge is tagged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is proposed only once it is a week old, so a compromised or
    # yanked version has time to be noticed first.
    cooldown:
      default-days: 7
    # This repository calls its own workflows by ./ path; the entry is the one
    # every repository carries, so that Dependabot, which reads a branch named
    # like a version as a pin, never proposes the next major of the kit.
    ignore:
      - dependency-name: "kleidos-dev/.github*"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /quality
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      quality-tools:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # crate-ci/typos also tags its sub-crates (varcon-core-v5.0.7), which
      # Dependabot reads as typos 5.0.7 (PR #10). typos itself is at 1.x.
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">= 2"]
    groups:
      hooks:
        patterns: ["*"]
