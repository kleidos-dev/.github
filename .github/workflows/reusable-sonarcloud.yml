#
# The SonarCloud analysis every public kleidos-dev repository runs, moved
# here from their CI unchanged (docs/sonarcloud.md, "Adding a project";
# docs/quality.md, "Reusable workflows"). It is secretless: the job trades
# its GitHub OIDC token for a short-lived, project-scoped SonarQube Cloud
# token, so no SONAR_TOKEN secret exists anywhere. sonar-project.properties
# in the calling repository holds every project setting. Called last, after
# the job that writes the coverage report:
#
#   sonarcloud:
#     name: "📊 SonarCloud"
#     needs: [tests]
#     uses: kleidos-dev/.github/.github/workflows/reusable-sonarcloud.yml@<kit commit> # quality-vX.Y.Z
#     permissions:
#       contents: read
#       id-token: write
#
# It analyses a push to main and a pull request against main, and nothing
# else. No continue-on-error: a failed token exchange, a scanner error or an
# analysis the server refuses is a red job, never a silent green. The one
# exception is a pull request GitHub gives no OIDC token (from a fork, or
# from Dependabot): the job says so in a notice and ends green, and
# SonarCloud analyses the change once it is on main.
name: SonarCloud

on:
  workflow_call:
    inputs:
      coverage-artifact:
        description: The artifact holding the coverage report sonar-project.properties names (empty for none)
        type: string
        default: coverage

permissions: {}

jobs:
  sonarcloud:
    name: "📊 Analysis"
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    # A bound for a hung scanner, with room for the scan to grow (15 minutes
    # is the owner's value in gitlab-mcp-server, where 5 cut off the upload).
    timeout-minutes: 15
    # Read-only on the code; id-token lets the job ask GitHub for the OIDC
    # token that SonarSource/sonarqube-auth-action exchanges for a
    # project-scoped SonarQube Cloud token (30 minutes, masked in the log).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: OIDC token available
        id: oidc
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${EVENT}" = pull_request ] && { [ "${HEAD_REPO}" != "${REPO}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; }; then
            echo "::notice title=SonarCloud skipped::GitHub gives this pull request (from ${HEAD_REPO}) no OIDC token, so the secretless analysis cannot run; it runs once the change is on main."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      # Full history: blame and the new-code period need it. The checkout
      # leaves no git credential behind for the steps that hold the token.
      - if: steps.oidc.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the coverage report
        if: steps.oidc.outputs.run == 'true' && inputs.coverage-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}

      # Right before the scan: the token lasts 30 minutes. It is exported as
      # SONAR_TOKEN for the later steps of this job only.
      - name: SonarCloud token from the OIDC token
        if: steps.oidc.outputs.run == 'true'
        id: auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      # The scanner detects the branch or pull request from the GitHub event;
      # sonar-project.properties holds the rest.
      - name: SonarCloud Scan
        if: steps.oidc.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      # The scanner's success means the report was uploaded; whether the
      # server accepted it is decided afterwards by a Compute Engine task (a
      # broken report, a refused analysis). This waits for that task and
      # fails the job unless it succeeded. The quality gate is not judged
      # here: SonarCloud's GitHub App reports it on the pull request.
      - name: SonarCloud accepted the analysis
        if: steps.oidc.outputs.run == 'true'
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          set -euo pipefail
          task="$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)"
          if [ -z "${task}" ]; then
            echo "::error::The scanner wrote no ceTaskId to .scannerwork/report-task.txt"
            exit 1
          fi
          while :; do
            body="$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/ce/task?id=${task}")"
            status="$(jq -r '.task.status' <<<"${body}")"
            case "${status}" in
              SUCCESS)
                echo "SonarCloud accepted analysis $(jq -r '.task.analysisId' <<<"${body}")"
                break
                ;;
              PENDING|IN_PROGRESS)
                sleep 5
                ;;
              *)
                reason="$(jq -r '.task.errorMessage // "no reason given"' <<<"${body}")"
                echo "::error::SonarCloud did not accept the analysis (${status}): ${reason}"
                exit 1
                ;;
            esac
          done
