#
# The quality kit's first entry workflow (docs/quality.md, "How a repository
# runs the kit"): what needs no build and no dependency, in minutes. Lint
# (every policy check and every hook), the hooks that read the deny-list, the
# licensing, the secrets scan, and the commit check: the messages of a pull
# request's commits, and whether what it or a push adds as the owner's is the
# owner's. Everything else waits for it.
#
#   quick:
#     name: "⚡ Quick"
#     uses: kleidos-dev/.github/.github/workflows/quick.yml@v3
#     with:
#       deny-hooks: my-metadata-hook
#     secrets:
#       deny: ${{ secrets.KLEIDOS_DENY_EXTRA }}
#     permissions:
#       contents: read
#
# It is the only kit workflow that receives a secret, by name, and hands it to
# one job that runs the repository's own local hooks and no third party's
# code: never `secrets: inherit`. Called
# at the branch: a workflow called at an annotated (or signed) tag cannot
# call the workflows beside it, and the run fails before its first job.
name: Quality kit, quick

on:
  workflow_call:
    inputs:
      skip:
        description: Comma-separated ids of the repository's own hooks that cannot run in CI
        type: string
        default: ""
      deny-hooks:
        description: Comma-separated ids of its own local hooks that read the deny-list
        type: string
        default: ""
    secrets:
      deny:
        description: The deny-list of private values (KLEIDOS_DENY_EXTRA), one pattern per line
        required: false

permissions: {}

jobs:
  lint:
    name: "🧹 Lint"
    uses: ./.github/workflows/reusable-lint.yml
    with:
      skip: ${{ inputs.skip }}
      deny-hooks: ${{ inputs.deny-hooks }}
    permissions:
      contents: read

  # Alone in its job: see reusable-deny.yml.
  deny:
    name: "🕵️ Deny-list"
    if: inputs.deny-hooks != ''
    uses: ./.github/workflows/reusable-deny.yml
    with:
      hooks: ${{ inputs.deny-hooks }}
    secrets:
      deny: ${{ secrets.deny }}
    permissions:
      contents: read

  reuse:
    name: "⚖️ Licensing"
    uses: ./.github/workflows/reusable-reuse.yml
    permissions:
      contents: read

  secrets:
    name: "🔐 Secrets"
    uses: ./.github/workflows/reusable-secrets.yml
    permissions:
      contents: read

  commits:
    name: "✍️ Commits"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/reusable-commit-check.yml
    permissions:
      contents: read
