#
# The quality kit's secrets gate: gitleaks over the whole history and over
# the tree, once with the repository's .gitleaks.toml (every default rule)
# and once with the kit's .gitleaks-mac.toml (the MAC rules, which extend
# nothing so no file type is skipped), inline allow comments ignored; then
# the plant test proves the MAC rules still fire on real shapes and spare
# the fakes. Private repositories have no GitHub secret scanning on the Free
# plan, so this is their only one. The binary is the release tools.lock
# pins, checked by SHA-256.
#
#   secrets:
#     name: "🔐 Secrets and MAC scan (gitleaks)"
#     needs: lint
#     uses: kleidos-dev/.github/.github/workflows/reusable-secrets.yml@v3
#     permissions:
#       contents: read
name: Quality kit secrets

on:
  workflow_call:

permissions: {}

jobs:
  gitleaks:
    name: "🔐 gitleaks, history and tree"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install gitleaks (pinned, SHA-256 checked) and the kit's tools
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: |
          python3 "${KIT}/quality/fetch_tool.py" gitleaks "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          python -I -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      - name: History, default rules
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - name: History, MAC rules
        run: gitleaks git . --config .gitleaks-mac.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - name: Tree, default rules
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - name: Tree, MAC rules
        run: gitleaks dir . --config .gitleaks-mac.toml --no-banner --redact --ignore-gitleaks-allow --verbose
      - name: The MAC rules fire on planted real shapes and spare the fakes
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python "${KIT}/quality/check_quality.py" --plant-mac
