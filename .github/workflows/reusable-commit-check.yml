#
# The commit check, a job of quick.yml, in two halves (docs/quality.md, "The
# commit-message gate" and "The identity of a commit"), with the checkers of
# the kit this workflow is part of. In kleidos-dev/.github itself those would
# be the pull request's own, so there the base branch's judge.
#
# The messages of a pull request's commits (base..head, merges skipped): the
# result goes to the job summary and to the commit-check artifact, which
# reusable-commit-check-comment.yml turns into the one comment on the pull
# request. A pull request opened by Dependabot or Renovate is not checked:
# they author their own messages, which nobody can reword.
#
# The identity of the commits a pull request, or a push to the default
# branch, adds: committer, signature and author, as GitHub reports them. The
# step has the read token only where the commits are ours to judge: a fork's
# pull request gets none, and none of its code runs.
name: Commit check

on:
  workflow_call:

permissions: {}

jobs:
  commit-messages:
    name: "✍️ Check the commits"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Check the pull request's commits
        id: check
        if: github.event_name == 'pull_request'
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            'dependabot[bot]' | 'renovate[bot]')
              echo "Opened by $PR_AUTHOR, which authors its own commit messages: not checked." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "status=0" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          out="$RUNNER_TEMP/commit-check"
          mkdir -p "$out"
          if [ "$GITHUB_REPOSITORY" = kleidos-dev/.github ]; then
            # The base branch's checker, where kit 2.x kept it or where it is now.
            git show "$BASE_SHA:hooks/check_commit_msg.py" > "$out/check_commit_msg.py" 2>/dev/null \
              || git show "$BASE_SHA:.github/commit-check/check_commit_msg.py" > "$out/check_commit_msg.py"
          else
            cp "$KIT/hooks/check_commit_msg.py" "$out/check_commit_msg.py"
          fi
          status=0
          python3 "$out/check_commit_msg.py" --range "$BASE_SHA..$HEAD_SHA" \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --json "$out/result.json" || status=$?
          if [ -f "$out/result.json" ]; then
            python3 "$out/check_commit_msg.py" --render "$out/result.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Keep the result for the comment workflow
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit-check
          path: ${{ runner.temp }}/commit-check/result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Check whose commits they are
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          JUDGE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GITHUB_TOKEN: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
        run: |
          set -euo pipefail
          judge="$KIT"
          if [ "$GITHUB_REPOSITORY" = kleidos-dev/.github ]; then
            # The base branch's checker, once it has one (3.4.0 brings it).
            judge="$RUNNER_TEMP/judge"
            mkdir -p "$judge"
            git archive "$JUDGE_SHA" hooks | tar -x -C "$judge"
            [ -f "$judge/hooks/commit_identity.py" ] || judge="$KIT"
          fi
          python3 "$judge/hooks/commit_identity.py"
      - name: Fail on a rule the commits break
        if: github.event_name == 'pull_request' && steps.check.outputs.status != '0'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "The commit messages break the rules listed above (exit $STATUS)."
          exit 1
