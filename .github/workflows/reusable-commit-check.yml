#
# The commit-message gate (kleidos-dev/agents' git-commits skill, whose
# checker this repository carries at .github/commit-check/), as a reusable
# workflow: the first check on every pull request. A repository's
# .github/workflows/commit-check.yml keeps its name, "Commit check", because
# the comment workflow follows it by that name:
#
#   name: Commit check
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: read
#   jobs:
#     commit-messages:
#       name: "✍️ Commit messages"
#       uses: kleidos-dev/.github/.github/workflows/reusable-commit-check.yml@<kit commit> # quality-vX.Y.Z
#       permissions:
#         contents: read
#
# It checks the pull request's commits (base..head, merges skipped) with the
# checker the base branch names, so a change to the checker, or to the kit
# commit a repository records, does not judge its own pull request: in
# kleidos-dev/.github the base branch's own copy, elsewhere the kit at the
# commit the base branch's .github/quality/SOURCE.json records. It writes
# the result to the job summary and to the commit-check artifact, which
# reusable-commit-check-comment.yml turns into the one comment on the pull
# request, and fails on any error. A pull request opened by Dependabot or
# Renovate is not checked: they author their own messages, which nobody can
# reword.
name: Commit check

on:
  workflow_call:

permissions: {}

jobs:
  commit-messages:
    name: "✍️ Check the commits"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the pull request's commits
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            'dependabot[bot]' | 'renovate[bot]')
              echo "Opened by $PR_AUTHOR, which authors its own commit messages: not checked." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "status=0" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          checker=.github/commit-check/check_commit_msg.py
          out="$RUNNER_TEMP/commit-check"
          mkdir -p "$out"
          source_json=.github/quality/SOURCE.json
          recorded=""
          if git show "$BASE_SHA:$source_json" > "$out/SOURCE.json" 2>/dev/null; then
            recorded="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$out/SOURCE.json")"
          elif [ -f "$source_json" ]; then
            echo "The base branch has not adopted the kit yet; using the kit commit this pull request records."
            recorded="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$source_json")"
          fi
          if [ -z "$recorded" ] || [ "$recorded" = self ]; then
            if [ -n "$recorded" ] && [ "$GITHUB_REPOSITORY" != kleidos-dev/.github ]; then
              echo "::error::SOURCE.json records commit self, which only kleidos-dev/.github may do"
              exit 1
            fi
            if ! git show "$BASE_SHA:$checker" > "$out/check_commit_msg.py" 2>/dev/null; then
              echo "The base branch has no checker yet; using the pull request's copy."
              cp "$checker" "$out/check_commit_msg.py"
            fi
          else
            kit="$RUNNER_TEMP/kit"
            git init -q "$kit"
            git -C "$kit" fetch -q --depth 1 https://github.com/kleidos-dev/.github "$recorded"
            git -C "$kit" show "FETCH_HEAD:$checker" > "$out/check_commit_msg.py"
          fi
          status=0
          python3 "$out/check_commit_msg.py" --range "$BASE_SHA..$HEAD_SHA" \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --json "$out/result.json" || status=$?
          if [ -f "$out/result.json" ]; then
            python3 "$out/check_commit_msg.py" --render "$out/result.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Keep the result for the comment workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit-check
          path: ${{ runner.temp }}/commit-check/result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail on a rule the commits break
        if: steps.check.outputs.status != '0'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "The commit messages break the rules listed above (exit $STATUS)."
          exit 1
