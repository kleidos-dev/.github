# The media metadata gate.
#
# Every tracked media file carries the Kleidos metadata profile
# (kleidos-media-meta/1) written from its record in
# profile/assets/assets.json, the repository is REUSE compliant, and the
# metadata tools pass their own tests.
#
# The identity patterns of the privacy deny-list are private, so they come
# from the KLEIDOS_DENY_EXTRA secret (one pattern per line). A run without
# the secret (a pull request from a fork or from Dependabot, which get no
# secrets, or a repository where it is not set yet) checks every other
# class and shows a warning that identity was not checked.
#
# The repository's gate, so it is named CI (the project's CI convention):
# the metadata job (seconds, its steps cheapest first, the tests measured by
# coverage.py), then the SonarCloud analysis of the tools, which reads that
# coverage report. The analysis is secretless: the job trades its GitHub
# OIDC token for a short-lived SonarQube Cloud token, so no SONAR_TOKEN
# secret exists in this repository.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: "🧹 Media metadata and REUSE"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
      KLEIDOS_DENY_OPTIONAL: ${{ secrets.KLEIDOS_DENY_EXTRA == '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned tools
        run: pip install -r requirements.txt
      - name: Install the REUSE tool
        run: pipx install reuse==6.3.0
      - name: REUSE compliance
        run: reuse lint
      - name: Metadata written from the records
        run: python3 scripts/stamp_media_meta.py --check
      - name: Metadata profile and privacy deny-list
        run: python3 scripts/check_metadata.py
      - name: Tests of the metadata tools
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage xml -o coverage.xml
      - name: Hand the coverage report to the SonarCloud job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  sonarcloud:
    name: "📊 SonarCloud"
    runs-on: ubuntu-latest
    # A bound for a hung scanner, with room for the scan to grow (15 minutes
    # is the owner's value in gitlab-mcp-server, where 5 cut off the upload).
    timeout-minutes: 15
    # Last stage: it reads the coverage the test job wrote, and a red gate
    # earlier stops it from spending a runner.
    needs: [metadata]
    # Read-only on the code; id-token lets the job ask GitHub for the OIDC
    # token that SonarSource/sonarqube-auth-action exchanges for a
    # project-scoped SonarQube Cloud token (30 minutes, masked in the log).
    permissions:
      contents: read
      id-token: write
    # No continue-on-error: on a push to main and on a pull request from
    # this repository, a failed token exchange, a scanner error or an
    # analysis the server refuses is a red job, never a silent green. The
    # one exception is a pull request that GitHub gives no OIDC token (from
    # a fork, or from Dependabot): the job says so in a notice and skips
    # the analysis; SonarCloud analyses the change once it is on main.
    steps:
      - name: OIDC token available
        id: oidc
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${EVENT}" = pull_request ] && { [ "${HEAD_REPO}" != "${REPO}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; }; then
            echo "::notice title=SonarCloud skipped::GitHub gives this pull request (from ${HEAD_REPO}) no OIDC token, so the secretless analysis cannot run; it runs once the change is on main."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      # Full history: blame and the new-code period need it. The checkout
      # leaves no git credential behind.
      - if: steps.oidc.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the coverage report
        if: steps.oidc.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # Exports the short-lived token as SONAR_TOKEN for the next steps.
      - name: SonarCloud token from the OIDC token
        if: steps.oidc.outputs.run == 'true'
        id: auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      # The scanner detects the branch or pull request from the GitHub event;
      # sonar-project.properties holds the rest.
      - name: SonarCloud Scan
        if: steps.oidc.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      # The scanner's success means the report was uploaded; whether the
      # server accepted it is decided afterwards by a Compute Engine task (a
      # broken report, a refused analysis). This waits for that task and
      # fails the job unless it succeeded. The quality gate is not judged
      # here: SonarCloud's GitHub App reports it on the pull request.
      - name: SonarCloud accepted the analysis
        if: steps.oidc.outputs.run == 'true'
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          set -euo pipefail
          task="$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)"
          if [ -z "${task}" ]; then
            echo "::error::The scanner wrote no ceTaskId to .scannerwork/report-task.txt"
            exit 1
          fi
          while :; do
            body="$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/ce/task?id=${task}")"
            status="$(jq -r '.task.status' <<<"${body}")"
            case "${status}" in
              SUCCESS)
                echo "SonarCloud accepted analysis $(jq -r '.task.analysisId' <<<"${body}")"
                break
                ;;
              PENDING|IN_PROGRESS)
                sleep 5
                ;;
              *)
                reason="$(jq -r '.task.errorMessage // "no reason given"' <<<"${body}")"
                echo "::error::SonarCloud did not accept the analysis (${status}): ${reason}"
                exit 1
                ;;
            esac
          done
