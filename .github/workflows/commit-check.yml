#
# The commit-message gate: the first check on every pull request. The job
# is the quality kit's reusable-commit-check.yml (docs/quality.md,
# "Reusable workflows"), called by path here, where it lives; every other
# repository calls it at the kit commit its .github/quality/SOURCE.json
# records. The checker itself is .github/commit-check/check_commit_msg.py,
# copied from kleidos-dev/agents (its git-commits skill). The comment on the
# pull request is posted by commit-check-comment.yml, which follows this
# workflow by its name.
name: Commit check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: "✍️ Commit messages"
    uses: ./.github/workflows/reusable-commit-check.yml
    permissions:
      contents: read
