#
# The quality kit's Python test job (docs/quality.md, "Reusable
# workflows"): the Python of .python-version, the repository's pinned
# dependencies, its test command, and the coverage report handed to the
# SonarCloud job as an artifact. Called as:
#
#   tests:
#     name: "🧪 Tests"
#     needs: lint
#     uses: kleidos-dev/.github/.github/workflows/reusable-python-tests.yml@v3
#     with:
#       run: python -m pytest -rs --cov --cov-report=xml:coverage.xml tests
#     permissions:
#       contents: read
#
# The test command writes the coverage report itself (pytest-cov or
# coverage.py, pinned in the repository's requirements), with paths
# relative to the repository, which SonarQube Cloud needs.
name: Python tests

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python to test with (empty reads python-version-file)
        type: string
        default: ""
      python-version-file:
        description: The file naming that Python (check_quality.py requires .python-version)
        type: string
        default: .python-version
      install:
        description: The command that installs the repository's pinned dependencies
        type: string
        default: python -m pip install -r requirements.txt
      run:
        description: The test command; it writes the coverage report
        type: string
        required: true
      coverage-report:
        description: The coverage report the test command writes (empty for none)
        type: string
        default: coverage.xml
      coverage-artifact:
        description: The artifact the report is uploaded as, for the SonarCloud job
        type: string
        default: coverage
      timeout-minutes:
        description: The bound for the whole job
        type: number
        default: 15

permissions: {}

jobs:
  tests:
    name: "🧪 Tests and coverage"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          python-version-file: ${{ inputs.python-version == '' && inputs.python-version-file || '' }}
      - name: Install the repository's dependencies
        if: inputs.install != ''
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "${INSTALL}"
      - name: Tests
        env:
          RUN: ${{ inputs.run }}
        run: bash -euo pipefail -c "${RUN}"
      - name: Hand the coverage report to the SonarCloud job
        if: inputs.coverage-report != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.coverage-report }}
          if-no-files-found: error
          retention-days: 1
