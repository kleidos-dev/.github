#
# The hooks of a repository that read the private deny-list, a job of
# quick.yml and of nothing else. It is the one kit job that holds a secret,
# so nothing of a third party runs in it: no hook repository, no cache, no
# package of the caller's, and before the step with the secret only the
# checkout, Python, the kit and its tools, installed by hash
# (quality/tests/test_secret_isolation.py holds it to that). Code that ran
# earlier in a job can reach the steps after it, through the files GitHub
# keeps for them or the workspace: a secret in a later step's environment is
# not out of its reach.
#
# quality/deny_hooks.py runs each hook from a configuration of its own, the
# caller's local entries and no other, and refuses a hook that installs
# anything. On a pull request of the same repository the hook is the pull
# request's own code, which somebody with write access wrote; one from a fork
# or from Dependabot gets no secret, and the checks then look for every other
# class and say so.
name: Quality kit deny-list

on:
  workflow_call:
    inputs:
      hooks:
        description: Comma-separated ids of the repository's own local hooks that read the deny-list
        type: string
        required: true
    secrets:
      deny:
        description: The deny-list of private values, one pattern per line
        required: false

permissions: {}

jobs:
  deny:
    name: "🕵️ Private values"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      - name: The hooks that read the deny-list
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          HOOKS: ${{ inputs.hooks }}
          KLEIDOS_DENY_EXTRA: ${{ secrets.deny }}
          KLEIDOS_DENY_OPTIONAL: ${{ secrets.deny == '' && '1' || '0' }}
        run: python "${KIT}/quality/deny_hooks.py" "${HOOKS}"
