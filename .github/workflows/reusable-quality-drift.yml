#
# The quality kit's drift notice. Each adopting repository calls it weekly
# from .github/workflows/quality-drift.yml (seeded by sync.py). It compares
# the kit commit .github/quality/SOURCE.json records with the newest kit
# release (the newest quality-v* tag of kleidos-dev/.github); when what a
# repository receives (quality/, the hook blocks, the reusable workflows,
# the commit-message checker) differs, it dry-runs that release on a copy
# of this tree, writes what a sync would bring to the job summary, and
# fails, so the red weekly run is the notice (GitHub mails it to whoever
# last changed the schedule). A merge to the kit's main that is not a
# release raises nothing. GitHub disables the schedule of a public
# repository with no activity for 60 days; docs/quality.md says how to
# notice it.
# Issues are off in most kleidos-dev repositories and a workflow may not
# open pull requests, so it writes nowhere: it needs only a read token,
# never pushes, and never runs pull-request code (it runs on the default
# branch). It is green again once a sync pull request has merged.
name: Quality kit drift

on:
  workflow_call:

permissions: {}

jobs:
  drift:
    name: "🔭 Compare with the newest kit release"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Is the recorded kit behind the newest release?
        id: compare
        run: |
          set -euo pipefail
          kit="${RUNNER_TEMP}/kit"
          git clone -q --filter=blob:none https://github.com/kleidos-dev/.github "${kit}"
          recorded="$(python3 -c 'import json; print(json.load(open(".github/quality/SOURCE.json"))["commit"])')"
          python -m pip install -q --require-hashes -r "${kit}/quality/requirements-tools.txt"
          # The kit's own sync.py names the newest quality-v* tag and compares
          # what a repository receives at the two commits (key=value lines).
          python "${kit}/quality/sync.py" --drift "${recorded}" > "${RUNNER_TEMP}/drift.txt"
          cat "${RUNNER_TEMP}/drift.txt"
          tag="$(sed -n 's/^tag=//p' "${RUNNER_TEMP}/drift.txt")"
          behind="$(sed -n 's/^behind=//p' "${RUNNER_TEMP}/drift.txt")"
          if [ "${behind}" = true ]; then
            git -C "${kit}" checkout -q "${tag}"
          fi
          {
            echo "kit=${kit}"
            echo "tag=${tag}"
            echo "commit=$(sed -n 's/^commit=//p' "${RUNNER_TEMP}/drift.txt")"
            echo "behind=${behind}"
          } >> "${GITHUB_OUTPUT}"
      - name: Dry-run the new kit on a copy of this tree
        if: steps.compare.outputs.behind == 'true'
        env:
          KIT: ${{ steps.compare.outputs.kit }}
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
          tree="${RUNNER_TEMP}/tree"
          cp -a "${GITHUB_WORKSPACE}" "${tree}"
          python "${KIT}/quality/sync.py" --write "${tree}" > "${RUNNER_TEMP}/sync.log" || true
          python "${KIT}/quality/check_quality.py" --kit "${KIT}" --repo "${tree}" --json "${RUNNER_TEMP}/check.json" > /dev/null || true
          (cd "${tree}" && ruff check --output-format concise --exit-zero . > "${RUNNER_TEMP}/ruff.txt" 2>&1 || true)
          git -C "${tree}" add -A
          git -C "${tree}" diff --cached --stat > "${RUNNER_TEMP}/diffstat.txt"
      - name: Report what a sync would bring
        if: steps.compare.outputs.behind == 'true'
        env:
          KIT: ${{ steps.compare.outputs.kit }}
          RELEASE_COMMIT: ${{ steps.compare.outputs.commit }}
          TAG: ${{ steps.compare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}" <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os, sys
          tmp = sys.argv[1]
          kit = os.environ["KIT"]
          commit = os.environ["RELEASE_COMMIT"]
          new = open(os.path.join(kit, "quality", "VERSION"), encoding="utf-8").read().strip()
          old = json.load(open(".github/quality/SOURCE.json", encoding="utf-8")).get("version", "?")
          path = os.path.join(tmp, "check.json")
          check = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {"problems": []}
          ruff = [ln for ln in open(os.path.join(tmp, "ruff.txt"), encoding="utf-8").read().splitlines() if ln.count(":") >= 3]
          diffstat = open(os.path.join(tmp, "diffstat.txt"), encoding="utf-8").read().strip()
          print(f"## Quality kit {new} available")
          print()
          tag = os.environ["TAG"]
          print(f"The Kleidos quality kit's newest release is **{new}** ([{tag}](https://github.com/kleidos-dev/.github/tree/{tag}), {commit[:12]}); this repository records **{old}**.")
          print()
          print(f"A sync is one pull request: check out `{tag}` in a clone of kleidos-dev/.github beside this repository, run `python3 ../.github/quality/sync.py --write .`, then fix every new finding in the same pull request (docs/quality.md in kleidos-dev/.github, \"Taking a new kit release\"). The kit's quality/CHANGELOG.md says what changed.")
          print()
          print(f"A dry run of the new kit on this repository's default branch found **{len(check['problems'])}** kit problem(s) and **{len(ruff)}** ruff finding(s); mypy is not counted here (it needs the repository's dependencies).")
          print()
          for p in check["problems"][:30]:
              print(f"- `{p['where']}` [{p['rule']}] {p['message']}")
          if len(check["problems"]) > 30:
              print(f"- ... and {len(check['problems']) - 30} more")
          print()
          print("<details><summary>Files the sync would change</summary>")
          print()
          print("```text")
          print(diffstat or "(none)")
          print("```")
          print()
          print("</details>")
          PY
          echo "::error title=Quality kit behind::kleidos-dev/.github has released quality kit ${TAG}; the job summary says what a sync would bring."
          exit 1
