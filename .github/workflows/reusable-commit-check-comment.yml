#
# Posts, updates or removes the one commit-check comment on a pull request,
# from the result reusable-commit-check.yml left as an artifact. A
# pull_request job from a fork gets a read-only token and cannot comment, so
# a repository calls this from a workflow_run caller, which runs as the
# default branch has it, with a token that may write (the model is
# quality/templates/run/commit-check-comment.yml).
#
# It runs the checker of the kit this workflow is part of, reads the artifact
# as data (validated, every string escaped), and acts only when that pull
# request's head is still the commit the check ran on. It never checks out or
# runs code from the pull request, or from the repository at all.
name: Commit check comment

on:
  workflow_call:

permissions: {}

jobs:
  comment:
    name: "🙋 Post the commit-check comment"
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # download the check's artifact
      pull-requests: write # create, edit or delete the one comment
    steps:
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          kit="${RUNNER_TEMP}/kit"
          git init -q "${kit}"
          git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
          git -C "${kit}" checkout -q FETCH_HEAD
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Fetch the check's result
        id: download
        # A run with no result (the check was skipped, or the artifact
        # expired) leaves nothing to post; the next step does not run.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: commit-check
          path: ${{ runner.temp }}/commit-check
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post, update or remove the comment
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          KIT: ${{ steps.kit.outputs.dir }}
        run: |
          python3 "$KIT/hooks/check_commit_msg.py" \
            --comment "$RUNNER_TEMP/commit-check/result.json" \
            --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
