#
# The quality kit's dependency gate: OSV-Scanner over every manifest and
# lockfile of the tree (pip, npm, pnpm, Go, Cargo...), failing on any known
# vulnerability. An accepted one goes in osv-scanner.toml with a reason and
# an ignoreUntil at most 90 days ahead (check_quality.py holds that). The
# binary is the release tools.lock pins, checked by SHA-256: the org allows
# no third-party action. Call it on pull requests and on a weekly schedule,
# so a new advisory against unchanged code turns red:
#
#   osv:
#     name: "🛡️ Dependency vulnerabilities (OSV)"
#     needs: lint
#     uses: kleidos-dev/.github/.github/workflows/reusable-osv.yml@v3
#     permissions:
#       contents: read
name: Quality kit dependencies

on:
  workflow_call:

permissions: {}

jobs:
  osv:
    name: "🛡️ OSV-Scanner"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Install OSV-Scanner (pinned, SHA-256 checked)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python3 "${KIT}/quality/fetch_tool.py" osv-scanner "${RUNNER_TEMP}/bin"
      - name: Scan every manifest and lockfile
        run: |
          set -uo pipefail
          status=0
          "${RUNNER_TEMP}/bin/osv-scanner" scan source --recursive --format markdown . > "${RUNNER_TEMP}/osv.md" || status=$?
          { echo "## OSV-Scanner"; echo; cat "${RUNNER_TEMP}/osv.md"; } >> "${GITHUB_STEP_SUMMARY}"
          cat "${RUNNER_TEMP}/osv.md"
          case "${status}" in
            0) echo "No known vulnerability." ;;
            128) echo "No manifest or lockfile in the tree: nothing to scan." ;;
            *) echo "::error::OSV-Scanner found known vulnerabilities (exit ${status}): fix them, or record each in osv-scanner.toml with a reason and an ignoreUntil"; exit "${status}" ;;
          esac
