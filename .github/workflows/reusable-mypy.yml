#
# The quality kit's type gate: mypy, configured by the repository's
# [tool.mypy] (the kit's strict block plus its own files and overrides),
# with the repository's dependencies installed so every import is typed.
# A repository that declares [[tool.kleidos-quality.mypy-groups]] gets one
# mypy run per group, each folded in the log, a failing group annotated and
# a table of every group in the job summary; the job fails if any group
# does, after all of them ran. Without groups it is one bare `mypy`.
# Owner, 2026-11-22: every error is fixed, no baseline. Called as:
#
#   types:
#     name: "🔎 Types (mypy)"
#     needs: lint
#     uses: kleidos-dev/.github/.github/workflows/reusable-mypy.yml@v3
#     with:
#       install: pip install -r requirements.txt
#     permissions:
#       contents: read
name: Quality kit types

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python to check against (empty reads python-version-file)
        type: string
        default: ""
      python-version-file:
        description: The file naming that Python
        type: string
        default: .python-version
      install:
        description: The command that installs the repository's dependencies
        type: string
        default: ""

permissions: {}

jobs:
  mypy:
    name: "🔎 mypy (strict)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          python-version-file: ${{ inputs.python-version == '' && inputs.python-version-file || '' }}
      - name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      - name: Install the repository's dependencies
        if: inputs.install != ''
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "${INSTALL}"
      - name: mypy, once per group
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python "${KIT}/quality/mypy_groups.py" --github
