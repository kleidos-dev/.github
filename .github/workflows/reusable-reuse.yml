#
# The quality kit's licensing gate (docs/quality.md, "Licensing headers"):
# `reuse lint` (every file states its copyright and license, in the file or
# in REUSE.toml), then spdx_headers.py (every file that can carry a comment
# carries both lines itself, copyright first, with the year git first added
# it and no e-mail). The whole history is fetched for those years. Called as:
#
#   reuse:
#     name: "⚖️ Licensing (REUSE)"
#     uses: kleidos-dev/.github/.github/workflows/reusable-reuse.yml@<kit commit> # quality-vX.Y.Z
#     permissions:
#       contents: read
name: Quality kit licensing

on:
  workflow_call:

permissions: {}

jobs:
  reuse:
    name: "⚖️ reuse lint and header lines"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The kit at the commit .github/quality/SOURCE.json records (kleidos-dev/.github
      # is public: no token), so the copies are judged by the kit's own bytes.
      - name: Fetch the quality kit at the recorded commit
        id: kit
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json; print(json.load(open(".github/quality/SOURCE.json"))["commit"])')"
          if [ "${commit}" = self ]; then
            if [ "${GITHUB_REPOSITORY}" != kleidos-dev/.github ]; then
              echo "::error::SOURCE.json records commit self, which only kleidos-dev/.github may do"
              exit 1
            fi
            echo "dir=${GITHUB_WORKSPACE}" >> "${GITHUB_OUTPUT}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${commit}"
            git -C "${kit}" checkout -q FETCH_HEAD
            echo "dir=${kit}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      - name: Every file states its copyright and license (reuse lint)
        run: reuse lint
      - name: Every file that can carry a comment carries both lines
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python "${KIT}/quality/spdx_headers.py"
