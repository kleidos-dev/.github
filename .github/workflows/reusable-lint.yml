#
# The quality kit's lint gate, called by every repository that adopts the kit
# (docs/quality.md):
#
#   lint:
#     name: "🧹 Lint (quality kit)"
#     uses: kleidos-dev/.github/.github/workflows/reusable-lint.yml@<kit commit> # quality-vX.Y.Z
#     permissions:
#       contents: read
#
# One job, cheapest first: the kit check (check_quality.py fetched from
# kleidos-dev/.github at the commit SOURCE.json records, so a local copy
# cannot judge itself), then every pre-commit hook on every file (the kit's
# blocks and the repository's own), then zizmor's online audits. Hooks that
# need a secret or a local environment are named in `skip`; mypy (which
# installs the repository's dependencies), reuse lint and the header lines
# (which need the whole history) have workflows of their own.
name: Quality kit lint

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python that runs the tools
        type: string
        default: "3.15"
      skip:
        description: >-
          Comma-separated ids of the repository's own hooks that cannot run here;
          a kit hook named here fails the kit check
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: "🧹 Kit check, hooks and zizmor"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kit at the commit .github/quality/SOURCE.json records (kleidos-dev/.github
      # is public: no token), so the copies are judged by the kit's own bytes.
      - name: Fetch the quality kit at the recorded commit
        id: kit
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json; print(json.load(open(".github/quality/SOURCE.json"))["commit"])')"
          if [ "${commit}" = self ]; then
            if [ "${GITHUB_REPOSITORY}" != kleidos-dev/.github ]; then
              echo "::error::SOURCE.json records commit self, which only kleidos-dev/.github may do"
              exit 1
            fi
            echo "dir=${GITHUB_WORKSPACE}" >> "${GITHUB_OUTPUT}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${commit}"
            git -C "${kit}" checkout -q FETCH_HEAD
            echo "dir=${kit}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      # --lint-skip refuses a skip input that names a hook of the kit's
      # blocks, read from the kit itself, so a stale local checker cannot let
      # a repository switch a kit hook off from its caller.
      - name: The kit check
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          EXTRA_SKIP: ${{ inputs.skip }}
        run: python "${KIT}/quality/check_quality.py" --kit "${KIT}" --lint-skip "${EXTRA_SKIP}" --summary "${GITHUB_STEP_SUMMARY}"
      - name: Cache the hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Every pre-commit hook on every file
        env:
          EXTRA_SKIP: ${{ inputs.skip }}
        run: |
          # The kit check ran above from the kit itself; mypy, reuse lint and the
          # header lines have workflows of their own (reusable-mypy.yml,
          # reusable-reuse.yml, which fetches the history the years need).
          export SKIP="kleidos-quality,mypy,reuse,kleidos-spdx-headers${EXTRA_SKIP:+,${EXTRA_SKIP}}"
          pre-commit run --all-files --show-diff-on-failure --color always
      - name: zizmor, online audits included
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .
