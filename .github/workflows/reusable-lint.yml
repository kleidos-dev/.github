#
# The quality kit's lint gate (docs/quality.md), a job of quick.yml, the
# entry workflow every repository calls.
#
# One job, cheapest first: the kit's policy checks (quality/policy.py, from
# the kit this workflow is part of, so nothing in the repository judges
# itself), then every pre-commit hook on every file, then zizmor's online
# audits. Hooks that need a local environment are named in `skip`; mypy
# (which installs the repository's dependencies), reuse lint and the header
# lines (which need the whole history) have workflows of their own.
#
# `deny-hooks` are the repository's own hooks that read the private deny-list:
# they are skipped here, where third parties' code runs, and run in the job
# of their own that holds the secret (reusable-deny.yml).
name: Quality kit lint

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python that runs the tools
        type: string
        default: "3.15"
      skip:
        description: >-
          Comma-separated ids of the repository's own hooks that cannot run here;
          a kit hook named here fails the kit check
        type: string
        default: ""
      deny-hooks:
        description: >-
          Comma-separated ids of the repository's own local hooks that read the
          deny-list, skipped here
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: "🧹 Kit check, hooks and zizmor"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kit that is running: this workflow's own repository and commit (a
      # ./ call inside the kit keeps both), so the checks and the workflow
      # are one release. actionlint 1.7.12 does not know these two keys of
      # the job context, hence the round trip through JSON. The kit is
      # public: it is fetched with no token.
      - name: The kit this workflow is part of
        id: kit
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          if [ "${KIT_REPO}" != kleidos-dev/.github ]; then
            echo "::error::the job context names '${KIT_REPO}' as this workflow's home, not kleidos-dev/.github"
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY}" = kleidos-dev/.github ]; then
            kit="${GITHUB_WORKSPACE}"
          else
            kit="${RUNNER_TEMP}/kit"
            git init -q "${kit}"
            git -C "${kit}" fetch -q --depth 1 https://github.com/kleidos-dev/.github "${KIT_SHA}"
            git -C "${kit}" checkout -q FETCH_HEAD
          fi
          { echo "dir=${kit}"; echo "sha=${KIT_SHA}"; } >> "${GITHUB_OUTPUT}"
          echo "kit v$(cat "${kit}/quality/VERSION") (${KIT_SHA})" | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the kit's tools (hashed)
        env:
          KIT: ${{ steps.kit.outputs.dir }}
        run: python -I -m pip install --require-hashes -r "${KIT}/quality/requirements-tools.txt"
      # Every policy check but the header lines, from the kit itself. A skip
      # or deny-hooks input that names a kit hook is refused here, so a
      # repository cannot switch a shared rule off from its caller.
      - name: The kit's policy checks
        env:
          KIT: ${{ steps.kit.outputs.dir }}
          KIT_SHA: ${{ steps.kit.outputs.sha }}
          OWN_HOOKS: ${{ inputs.skip }},${{ inputs.deny-hooks }}
        run: >-
          python "${KIT}/quality/policy.py" --without spdx-headers --lint-skip "${OWN_HOOKS}"
          --github --summary "${GITHUB_STEP_SUMMARY}" --kit-sha "${KIT_SHA}"
      - name: Cache the hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Every pre-commit hook on every file
        env:
          OWN_HOOKS: ${{ inputs.skip }},${{ inputs.deny-hooks }}
        run: |
          # The policy checks ran above from the kit itself; mypy, reuse lint
          # and the header lines have workflows of their own. The first five
          # ids are the hooks of a repository that still holds kit 2.x copies.
          export SKIP="kleidos-quality,kleidos-md-nowrap,kleidos-agent-docs,kleidos-spdx-headers,mypy,kleidos-kit,kleidos-mypy,reuse,${OWN_HOOKS}"
          pre-commit run --all-files --show-diff-on-failure --color always
      - name: zizmor, online audits included
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .
