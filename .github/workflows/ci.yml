#
# The repository's gate, so it is named CI (the project's CI convention).
# This repository is the quality kit's home and its first caller: the kit's
# checks are its own entry workflows, called here by ./ path, so a pull
# request that changes one runs the changed version. What only this
# repository does is a job of its own beside them.
#
# Stages: quick first (lint, licensing, secrets, commit messages; the media
# hooks with the deny-list among them); then the tests (the media tools' and
# the kit's, with coverage), the types and OSV, and the kit release check (a
# kit change bumps quality/VERSION; a version on main has its tag); then the
# impact preview, which applies the changed kit to throwaway clones of the
# public repositories and writes what it would find to the job summary (it
# informs, it does not gate), and the SonarCloud analysis, which reads the
# tests' coverage; last the one required check, which needs them all. On the
# weekly schedule the OSV scan catches new advisories against unchanged
# code; a kit pin that has a newer release is a line of the ecosystem
# report (ecosystem.yml), never a red check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 06:00 Europe/Madrid in winter, with the Dependabot runs.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: "⚡ Quick"
    uses: ./.github/workflows/quick.yml
    with:
      # The kit's tests run in the check job.
      skip: kleidos-quality-kit-tests
      # The media hooks read the private identity patterns; a run without
      # them (a fork's or Dependabot's pull request) checks every other class.
      deny-hooks: kleidos-media-stamp,kleidos-media-metadata
    secrets:
      deny: ${{ secrets.KLEIDOS_DENY_EXTRA }}
    permissions:
      contents: read

  check:
    name: "🧪 Check"
    needs: quick
    uses: ./.github/workflows/check.yml
    with:
      install: >-
        python -I -m pip install -r requirements.txt
        && python -I -m pip install --require-hashes -r quality/requirements-tools.txt
      # coverage.py measures the media tools and the kit (.coveragerc).
      tests: >-
        python -m coverage run -m unittest discover -s tests -v
        && python -m coverage run --append -m unittest discover -s quality/tests -v
        && python -m coverage xml -o coverage.xml
        && python -m coverage report
        && python quality/coverage_floor.py
    permissions:
      contents: read

  # Repositories run released kits only. A pull request that changes what
  # they run bumps quality/VERSION and adds its CHANGELOG entry; on main, a
  # version without its tag turns this job red until the merge commit is
  # tagged (signed), the branch v<major> is moved to it, and the job is
  # re-run (docs/quality.md, "Changing the kit").
  release:
    name: "🏷️ Kit release and its tag"
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install the kit's tools (hashed)
        run: python -I -m pip install --require-hashes -r quality/requirements-tools.txt
      - name: The kit at this commit is a release, or a new version
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch -q --tags --force origin
          on_main=()
          if [ "${EVENT}" != pull_request ]; then
            on_main=(--on-main)
          fi
          python quality/sync.py --release-check --online "${on_main[@]}"

  preview:
    name: "🔭 Impact on the public consumers"
    needs: check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install the kit's tools (hashed)
        run: python -I -m pip install --require-hashes -r quality/requirements-tools.txt
      - name: Apply the kit to throwaway clones and count what it finds
        run: python tools/ecosystem.py preview --summary "${GITHUB_STEP_SUMMARY}"

  sonar:
    name: "📊 Sonar"
    needs: check
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
      id-token: write

  # The one required check (docs/quality.md, "The gate").
  done:
    name: "✅ Check"
    needs: [quick, check, release, preview, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job of this file succeeded
        # -p: no BASH_ENV, no function and no option from the environment; and
        # both variables are always set here, so nothing outside the step steers it.
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: preview sonar
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin HOME=/nonexistent
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${NEEDS}" | jq -e --arg may " ${MAY_SKIP} " '
            length > 0 and all(to_entries[];
              .value.result == "success"
              or (.value.result == "skipped" and (.key as $job | $may | contains(" \($job) "))))' > /dev/null || {
            echo "::error title=Not every job succeeded::a job that failed, was cancelled or was skipped without leave is listed above"
            exit 1
          }
